<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project List</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Project List</h1>

    <form id="form">
      <input id="name" placeholder="项目名称" required maxlength="100">
      <input id="description" placeholder="描述（可选）" maxlength="500">
      <select id="status">
        <option value="planned">计划中</option>
        <option value="active">进行中</option>
        <option value="done">已完成</option>
      </select>
      <button type="submit">添加</button>
    </form>

    <div id="filters">
      <button data-filter="all" class="on">全部</button>
      <button data-filter="planned">计划中</button>
      <button data-filter="active">进行中</button>
      <button data-filter="done">已完成</button>
    </div>

    <ul id="list"></ul>
    <p id="empty" hidden>暂无项目</p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
